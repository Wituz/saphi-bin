name: Update AUR Package

on:
  schedule:
    - cron: '0 */6 * * *'  # Check every 6 hours
  workflow_dispatch:        # Allow manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm git openssh

      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest upstream release
        id: release
        run: |
          TAG=$(curl -s https://api.github.com/repos/Project-Saphi/Saphi/releases/latest | grep '"tag_name"' | sed 's/.*: "//;s/".*//')
          PKGVER=$(echo "$TAG" | sed 's/^v//;s/-/./g')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "pkgver=$PKGVER" >> "$GITHUB_OUTPUT"
          echo "Latest release: $TAG -> pkgver $PKGVER"

      - name: Check if GitHub needs updating
        id: check_github
        run: |
          CURRENT=$(grep '^pkgver=' PKGBUILD | cut -d= -f2)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.release.outputs.pkgver }}" = "$CURRENT" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update PKGBUILD
        if: steps.check_github.outputs.needed == 'true'
        run: |
          sed -i "s/^pkgver=.*/pkgver=${{ steps.release.outputs.pkgver }}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD

      - name: Generate .SRCINFO
        if: steps.check_github.outputs.needed == 'true'
        run: |
          useradd -m builder
          chown -R builder:builder .
          su builder -c "makepkg --printsrcinfo > .SRCINFO"
          chown -R root:root .

      - name: Push to GitHub
        if: steps.check_github.outputs.needed == 'true'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to ${{ steps.release.outputs.pkgver }}"
          git push origin master

      - name: Set up SSH for AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          mkdir -p /root/.ssh
          echo "$AUR_SSH_KEY" > /root/.ssh/aur
          chmod 600 /root/.ssh/aur
          printf 'Host aur.archlinux.org\n  IdentityFile /root/.ssh/aur\n  StrictHostKeyChecking accept-new\n  UserKnownHostsFile /dev/null\n' > /root/.ssh/config
          ssh-keyscan aur.archlinux.org >> /root/.ssh/known_hosts 2>/dev/null

      - name: Push to AUR
        run: |
          # Clone AUR repo and check if it needs updating
          git clone ssh://aur@aur.archlinux.org/saphi-bin.git /tmp/aur-pkg
          AUR_VER=$(grep '^pkgver=' /tmp/aur-pkg/PKGBUILD | cut -d= -f2)
          echo "AUR version: $AUR_VER"
          echo "Latest version: ${{ steps.release.outputs.pkgver }}"
          if [ "$AUR_VER" = "${{ steps.release.outputs.pkgver }}" ]; then
            echo "AUR already up to date"
            exit 0
          fi
          # Copy updated files (flat only, no subdirectories)
          cp PKGBUILD .SRCINFO saphi.desktop /tmp/aur-pkg/
          cd /tmp/aur-pkg
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update to ${{ steps.release.outputs.pkgver }}"
          git push
